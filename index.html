<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quint Light — MIDI Drum Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">QL</span>
      <div class="brand-text">
        <h1>Quint Light</h1>
        <p>MIDI-to-drum light mapper</p>
      </div>
    </div>
    <div class="header-status" id="fileStatus">No file loaded</div>
  </header>

  <main class="layout">

    <section class="rig-panel">
      <svg id="rigSvg" viewBox="0 0 1340 680" xmlns="http://www.w3.org/2000/svg">
        <line class="stand-bar" x1="150" y1="565" x2="1000" y2="565"></line>
        <line class="stand-leg" x1="200" y1="535" x2="200" y2="565"></line>
        <line class="stand-leg" x1="950" y1="535" x2="950" y2="565"></line>
        <line class="stand-leg" x1="570" y1="528" x2="570" y2="565"></line>

        <g class="drum" data-zone="tom2">
          <ellipse class="drum-shadow" cx="385" cy="382" rx="70" ry="14"></ellipse>
          <circle class="drum-rim" cx="385" cy="310" r="75"></circle>
          <circle class="drum-head" cx="385" cy="310" r="64"></circle>
        </g>

        <g class="drum" data-zone="tom4">
          <ellipse class="drum-shadow" cx="760" cy="382" rx="70" ry="14"></ellipse>
          <circle class="drum-rim" cx="760" cy="310" r="75"></circle>
          <circle class="drum-head" cx="760" cy="310" r="64"></circle>
        </g>

        <g class="drum" data-zone="tom1">
          <ellipse class="drum-shadow" cx="190" cy="532" rx="88" ry="16"></ellipse>
          <circle class="drum-rim" cx="190" cy="460" r="95"></circle>
          <circle class="drum-head" cx="190" cy="460" r="82"></circle>
        </g>

        <g class="drum" data-zone="tom5">
          <ellipse class="drum-shadow" cx="950" cy="532" rx="88" ry="16"></ellipse>
          <circle class="drum-rim" cx="950" cy="460" r="95"></circle>
          <circle class="drum-head" cx="950" cy="460" r="82"></circle>
        </g>

        <g class="drum" data-zone="cymbalRod">
          <line class="rod-line" x1="1015" y1="405" x2="1062" y2="298"></line>
          <ellipse class="rod-cymbal" cx="1064" cy="288" rx="40" ry="12" transform="rotate(-18 1064 288)"></ellipse>
        </g>

        <g class="drum" data-zone="tom3">
          <ellipse class="drum-shadow" cx="570" cy="548" rx="55" ry="12"></ellipse>
          <circle class="drum-rim" cx="570" cy="488" r="58"></circle>
          <circle class="drum-head" cx="570" cy="488" r="48"></circle>
        </g>

        <g class="drum" data-zone="bass">
          <ellipse class="drum-shadow" cx="1190" cy="562" rx="108" ry="18"></ellipse>
          <circle class="drum-rim" cx="1190" cy="480" r="118"></circle>
          <circle class="drum-head" cx="1190" cy="480" r="103"></circle>
        </g>

        <text class="zone-label" x="190" y="586">TOM 1</text>
        <text class="zone-label" x="385" y="406">TOM 2</text>
        <text class="zone-label" x="570" y="612">TOM 3</text>
        <text class="zone-label" x="760" y="406">TOM 4</text>
        <text class="zone-label" x="950" y="586">TOM 5</text>
        <text class="zone-label" x="1064" y="266">CYMBAL</text>
        <text class="zone-label" x="1190" y="628">BASS DRUM</text>

        <text class="zone-sub" id="sub-tom1" x="190" y="602"></text>
        <text class="zone-sub" id="sub-tom2" x="385" y="422"></text>
        <text class="zone-sub" id="sub-tom3" x="570" y="628"></text>
        <text class="zone-sub" id="sub-tom4" x="760" y="422"></text>
        <text class="zone-sub" id="sub-tom5" x="950" y="602"></text>
        <text class="zone-sub" id="sub-cymbalRod" x="1064" y="250"></text>
        <text class="zone-sub" id="sub-bass" x="1190" y="644"></text>
      </svg>
      <p class="rig-hint">Click a drum to preview its assigned sound and light.</p>
    </section>

    <aside class="control-panel">

      <div class="panel-block">
        <h2>Midi file</h2>
        <label class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept=".mid,.midi" hidden>
          <span id="dropLabel">Drop a .mid file here or click to browse</span>
        </label>
        <div class="file-meta" id="fileMeta"></div>
      </div>

      <div class="panel-block">
        <h2>Transport</h2>
        <div class="transport-row">
          <button class="btn" id="playBtn" disabled>Play</button>
          <button class="btn" id="stopBtn" disabled>Stop</button>
          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        </div>
        <input type="range" id="seekBar" min="0" max="1000" value="0" disabled>
        <div class="volume-row">
          <label for="volumeSlider">Volume</label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.75">
        </div>
      </div>

      <div class="panel-block">
        <h2>Audio mode</h2>
        <div class="segmented" id="audioModeToggle">
          <button class="segment active" data-mode="all">All instruments</button>
          <button class="segment" data-mode="mapped">Mapped only</button>
        </div>
        <p class="hint-text">Lights only ever trigger for drums you've mapped below.</p>
      </div>

      <div class="panel-block mapping-block">
        <h2>Drum mapping</h2>
        <div class="mapping-list" id="mappingList"></div>
      </div>

    </aside>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="app.js"></script>
</body>
</html>
